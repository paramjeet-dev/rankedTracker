services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: coc
      POSTGRES_PASSWORD: ${PG_PASSWORD:-coc}
      POSTGRES_DB: coc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "work_mem=64MB", "-c", "max_wal_size=4GB", "-c", "synchronous_commit=off"]
volumes:
  pgdata:
